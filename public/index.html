<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>EPro 投研</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <style>
    .meta { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
    .tab-pane { display: none; }
    .up { color: #e54545; font-weight: 600; }
    .down { color: #1aab5a; font-weight: 600; }
    .ok { color: #1aab5a; font-weight: 600; }
    .fail { color: #e54545; font-weight: 600; }
    .watch { color: #c80; }
    .alert { background: #fff7e6; border: 1px solid #f0c36d; padding: 8px 12px; margin-bottom: 10px; border-radius: 8px; font-size: 13px; }
    .combo-link { color: var(--primary); text-decoration: none; cursor: pointer; }
    .follow-item, .stock-item.bt-hit-row, .history-row { cursor: pointer; }
    .follow-item.selected, .stock-item.selected {
      background: #f8fbff;
      margin-left: -8px;
      margin-right: -8px;
      padding-left: 8px;
      padding-right: 8px;
      border-radius: 8px;
    }
    #kline-chart { width: 100%; height: 320px; }
    .signal-kline { display: block; width: 100%; max-width: 100%; height: auto; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">EPro 投研</div>

    <div id="tab-recommend" class="tab-pane" style="display:block">
      <div class="panel">
        <div id="alerts"></div>
        <div class="card">
          <div class="meta" id="rec-date">加载中…</div>
          <div id="recommend-list"><div class="muted">加载中…</div></div>
        </div>
        <div class="card" id="track-card">
          <h3>跟踪状态</h3>
          <div class="meta" id="track-date"></div>
          <div id="track-list"><div class="muted">加载中…</div></div>
        </div>
      </div>
    </div>

    <div id="tab-signal" class="tab-pane">
      <div class="panel">
        <div class="card">
          <div class="meta" id="signal-meta">从回溯分析点击组合名查看</div>
          <div id="signal-list"><div class="muted">从回溯分析点击组合名查看当日信号</div></div>
        </div>
      </div>
    </div>

    <div id="tab-history" class="tab-pane">
      <div class="panel">
        <div class="card">
          <div class="meta" id="history-meta">加载中…</div>
          <div id="history-list" class="bt-scroll"></div>
        </div>
        <div class="card" id="kline-card" style="display:none">
          <div class="meta" id="chart-title"></div>
          <div id="kline-chart" style="width:100%;height:320px"></div>
        </div>
      </div>
    </div>

    <div id="tab-analyze" class="tab-pane">
      <div class="panel">
        <div class="card">
          <div class="filters" id="bt-level-filters">
            <div class="control-title">收益周期</div>
            <span class="chip active" data-value="1">1</span>
            <span class="chip" data-value="2">2</span>
            <span class="chip" data-value="3">3</span>
            <span class="chip" data-value="5">5</span>
            <span class="chip" data-value="7">7</span>
            <span class="chip" data-value="20">20</span>
            <span class="chip" data-value="60">60</span>
          </div>
          <div class="filters" id="bt-days-filters" style="margin-top:8px">
            <div class="control-title">样本范围</div>
            <span class="chip active" data-value="3">3天</span>
            <span class="chip" data-value="7">7天</span>
            <span class="chip" data-value="15">15天</span>
            <span class="chip" data-value="30">30天</span>
            <span class="chip" data-value="60">60天</span>
          </div>
        </div>
        <div class="card">
          <div class="meta" id="bt-summary-meta">加载中…</div>
          <div id="bt-summary-list" class="bt-scroll"></div>
        </div>
        <div class="card">
          <div class="meta" id="bt-group-meta">点击上方组合查看详情</div>
          <div id="bt-group-list" class="bt-scroll"></div>
        </div>
        <div class="card">
          <div class="meta" id="bt-stock-meta">点击命中详情中的股票查看</div>
          <img id="bt-stock-kline" class="chart-img" alt="日K" style="display:none" onerror="this.style.display='none'">
          <div id="bt-stock-list" class="bt-scroll" style="margin-top:8px"></div>
        </div>
      </div>
    </div>

    <div class="tabbar" id="tab-bar">
      <button type="button" class="tab-btn active" data-tab="recommend">今日推荐</button>
      <button type="button" class="tab-btn" data-tab="signal">当日信号</button>
      <button type="button" class="tab-btn" data-tab="history">历史回放</button>
      <button type="button" class="tab-btn" data-tab="analyze">回溯分析</button>
    </div>
  </div>

  <script src="/echarts.min.js"></script>

  <script>
    var FACTOR_CN = {
      "macd_golden": "MACD金叉",
      "gap_up": "跳空高开",
      "one_yang_3ma": "一阳穿三线",
      "ma_bull": "多头排列",
      "above_ma20": "站上20日线",
      "ma5_cross_10": "5日穿10日",
      "second_breakout": "二次突破",
      "shrink_pullback": "缩量回调",
      "volume_ratio_high": "放量突破",
      "new_high_20": "创20日新高",
      "limit_up": "涨停",
      "expma_golden": "EXPMA金叉",
      "box_breakout": "箱体突破",
      "kline_reversal": "K线反转"
    };
    function comboCn(combo) {
      if (combo === null || combo === undefined || combo === "") return "-";
      return String(combo).split("+").map(function (name) {
        name = name.replace(/^\s+|\s+$/g, "");
        return FACTOR_CN[name] || name;
      }).join("+");
    }
    function sinaDailyImg(dm) {
      var code = String(dm || "").replace(/\D/g, "");
      if (code.length < 6) return "";
      code = code.slice(0, 6);
      var prefix = code.charAt(0) === "6" ? "sh" : "sz";
      return "https://image.sinajs.cn/newchart/daily/n/" + prefix + code + ".gif";
    }
    function fmt(v) {
      if (v === null || v === undefined || v === "") return "-";
      if (typeof v === "number") return v.toFixed(2);
      return String(v);
    }
    function statusClass(s) {
      if (s === "达标") return "ok";
      if (s === "不达标") return "fail";
      return "watch";
    }
    function renderList(el, rows, emptyText) {
      if (!rows || !rows.length) {
        el.innerHTML = '<div class="muted">' + emptyText + "</div>";
        return;
      }
      el.innerHTML = rows.map(function (r) { return r; }).join("");
    }

    fetch("/api/recommend")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        document.getElementById("rec-date").textContent =
          data.date ? ("推荐日 " + data.date + "（最多 3 只）") : "暂无推荐";
        var items = data.items || [];
        renderList(
          document.getElementById("recommend-list"),
          items.map(function (it) {
            return '<div class="stock-item">' +
              '<div class="stock-title">' +
              '<div class="stock-title-main"><a>' +
              (it.dm || "-") + (it.mc ? " " + it.mc : "") +
              "</a></div>" +
              "<strong>" + fmt(it.score) + "</strong>" +
              "</div>" +
              '<div class="stock-sub muted">策略 ' + (it.strategy || "-") + "</div>" +
              '<div class="stock-meta muted">买入 ' + fmt(it.entry_price) +
              "　止损 " + fmt(it.stop_loss) + "</div>" +
              "</div>";
          }),
          "暂无推荐"
        );
      })
      .catch(function () {
        document.getElementById("rec-date").textContent = "推荐接口请求失败";
        document.getElementById("recommend-list").innerHTML =
          '<div class="muted">加载失败</div>';
      });

    fetch("/api/track")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        document.getElementById("track-date").textContent =
          data.date ? ("跟踪日 " + data.date) : "暂无跟踪";
        var alerts = data.alerts || [];
        var box = document.getElementById("alerts");
        if (alerts.length) {
          box.innerHTML = alerts.map(function (a) {
            return '<div class="alert">尾盘提醒：' +
              (a.dm || "") + " " + (a.mc || "") +
              " 最新价 " + fmt(a.current_price) +
              " / 买入 " + fmt(a.entry_price) +
              " / 止损 " + fmt(a.stop_loss) +
              "</div>";
          }).join("");
        }
        var items = data.items || [];
        renderList(
          document.getElementById("track-list"),
          items.map(function (it) {
            return '<div class="stock-item">' +
              '<div class="stock-title">' +
              '<div class="stock-title-main"><a>' +
              (it.dm || "-") + (it.mc ? " " + it.mc : "") +
              "</a></div>" +
              '<span class="' + statusClass(it.status) + '">' + (it.status || "-") + "</span>" +
              "</div>" +
              '<div class="stock-meta muted">最新 ' + fmt(it.current_price) +
              "　买入 " + fmt(it.entry_price) +
              "　止损 " + fmt(it.stop_loss) + "</div>" +
              "</div>";
          }),
          "暂无跟踪"
        );
      })
      .catch(function () {
        document.getElementById("track-date").textContent = "跟踪接口请求失败";
        document.getElementById("track-list").innerHTML =
          '<div class="muted">加载失败</div>';
      });

    var historyRecords = [];
    var historyChart = null;

    function switchTab(name) {
      if (!name) return;
      var panes = ["recommend", "signal", "history", "analyze"];
      for (var i = 0; i < panes.length; i++) {
        var pane = document.getElementById("tab-" + panes[i]);
        if (pane) pane.style.display = panes[i] === name ? "block" : "none";
      }
      var btns = document.querySelectorAll(".tab-btn");
      Array.prototype.forEach.call(btns, function (btn) {
        if (btn.getAttribute("data-tab") === name) btn.classList.add("active");
        else btn.classList.remove("active");
      });
      if (historyChart && name === "history") {
        setTimeout(function () {
          var box = document.getElementById("kline-chart");
          var card = document.getElementById("kline-card");
          if (historyChart && box && card && card.style.display !== "none") historyChart.resize();
        }, 0);
      }
    }
    document.getElementById("tab-bar").addEventListener("click", function (ev) {
      var btn = ev.target;
      if (!btn || !btn.getAttribute) return;
      if (btn.tagName !== "BUTTON" || !btn.classList.contains("tab-btn")) return;
      switchTab(btn.getAttribute("data-tab"));
    });

    function retClass(v) {
      if (typeof v !== "number") return "";
      return v > 0 ? "up" : "down";
    }
    function fmtRet(v) {
      if (v === null || v === undefined || v === "") return "-";
      var n = Number(v);
      if (isNaN(n)) return String(v);
      return (n > 0 ? "+" : "") + n.toFixed(2) + "%";
    }
    function fmtAxisDate(s) {
      if (!s) return "";
      return String(s).slice(5);
    }
    function setKlineVisible(show) {
      var box = document.getElementById("kline-chart");
      var card = document.getElementById("kline-card");
      var display = show ? "block" : "none";
      if (box) box.style.display = display;
      if (card) card.style.display = display;
    }
    function renderKline(rec) {
      var box = document.getElementById("kline-chart");
      var title = document.getElementById("chart-title");
      if (!rec) return;
      title.textContent =
        (rec.dm || "") + " " + (rec.mc || "") +
        " 买入日 " + (rec.buy_date || "-") +
        " 买入 " + fmt(rec.entry) +
        " 止损 " + fmt(rec.stop);
      if (typeof echarts === "undefined") {
        setKlineVisible(false);
        title.textContent += "（ECharts 未加载）";
        return;
      }
      title.textContent += "　K线加载中…";
      fetch("/api/kline?dm=" + encodeURIComponent(rec.dm || "") + "&date=" + encodeURIComponent(rec.buy_date || ""))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var klines = (data && data.klines) || [];
          if (!klines.length) {
            setKlineVisible(false);
            title.textContent = title.textContent.replace("　K线加载中…", "（无K线数据）");
            return;
          }
          title.textContent = title.textContent.replace("　K线加载中…", "");
          setKlineVisible(true);
          void box.offsetWidth;
          if (box.scrollIntoView) {
            box.scrollIntoView({ behavior: "smooth", block: "nearest" });
          }
          if (!historyChart) {
            historyChart = echarts.init(box);
            window.addEventListener("resize", function () {
              if (historyChart) historyChart.resize();
            });
          } else {
            historyChart.resize();
          }
          var dates = klines.map(function (k) { return k.t || ""; });
          var candle = klines.map(function (k) {
            return [k.o, k.c, k.l, k.h];
          });
          var ma5 = klines.map(function (k) { return k.ma5; });
          var ma10 = klines.map(function (k) { return k.ma10; });
          var ma20 = klines.map(function (k) { return k.ma20; });
          var buyDate = rec.buy_date || "";
          var markPointData = [];
          if (buyDate && dates.indexOf(buyDate) >= 0 && rec.entry != null) {
            markPointData.push({
              name: "买入",
              coord: [buyDate, rec.entry],
              value: rec.entry,
              itemStyle: { color: "#1677ff" },
              label: { formatter: "买入 " + fmt(rec.entry) }
            });
          }
          var markLineData = [];
          if (rec.stop != null) {
            markLineData.push({
              name: "止损",
              yAxis: rec.stop,
              lineStyle: { color: "#c33", type: "dashed", width: 1.5 },
              label: { formatter: "止损 " + fmt(rec.stop), position: "insideEndTop" }
            });
          }
          historyChart.setOption({
            animation: false,
            legend: { data: ["K线", "MA5", "MA10", "MA20"], top: 4 },
            tooltip: {
              trigger: "axis",
              axisPointer: { type: "cross" }
            },
            grid: { left: 48, right: 24, top: 36, bottom: 48 },
            xAxis: {
              type: "category",
              data: dates,
              axisLabel: { formatter: fmtAxisDate },
              boundaryGap: true
            },
            yAxis: { scale: true, splitLine: { lineStyle: { type: "dotted" } } },
            dataZoom: [{ type: "inside" }, { type: "slider", height: 18, bottom: 8 }],
            series: [
              {
                name: "K线",
                type: "candlestick",
                data: candle,
                itemStyle: {
                  color: "#ef232a",
                  color0: "#14b143",
                  borderColor: "#ef232a",
                  borderColor0: "#14b143"
                },
                markPoint: {
                  symbol: "pin",
                  symbolSize: 48,
                  data: markPointData
                },
                markLine: {
                  silent: true,
                  symbol: "none",
                  data: markLineData
                }
              },
              { name: "MA5", type: "line", data: ma5, showSymbol: false, lineStyle: { width: 1.2 }, color: "#fa8c16" },
              { name: "MA10", type: "line", data: ma10, showSymbol: false, lineStyle: { width: 1.2 }, color: "#1677ff" },
              { name: "MA20", type: "line", data: ma20, showSymbol: false, lineStyle: { width: 1.2 }, color: "#722ed1" }
            ]
          }, true);
        })
        .catch(function () {
          setKlineVisible(false);
          title.textContent = title.textContent.replace("　K线加载中…", "（K线加载失败）");
        });
    }

    fetch("/api/history")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var combo = data.combo || "-";
        var period = data.period || "-";
        var wr = data.win_rate;
        var exp = data.expectation;
        document.getElementById("history-meta").textContent =
          "最优组合 " + comboCn(combo) +
          "　周期 " + period +
          "　胜率 " + (wr == null ? "-" : Number(wr).toFixed(2) + "%") +
          "　期望收益 " + (exp == null ? "-" : Number(exp).toFixed(2));
        historyRecords = data.records || [];
        if (!historyRecords.length) {
          document.getElementById("history-list").innerHTML =
            '<div class="muted">暂无历史回放，请先运行 replay_save.py</div>';
          return;
        }
        document.getElementById("history-list").innerHTML = historyRecords.map(function (it, i) {
          return '<div class="follow-item history-row" data-idx="' + i + '">' +
            '<div class="follow-item-head">' +
            '<span class="follow-code">' + (it.dm || "-") + " " + (it.mc || "-") + "</span>" +
            '<span class="' + retClass(it.ret) + '">' + fmtRet(it.ret) + "</span>" +
            "</div>" +
            '<div class="follow-fields">' +
            '<div><span class="follow-label">买入日</span>' + (it.buy_date || "-") + "</div>" +
            '<div><span class="follow-label">买入价</span>' + fmt(it.entry) + "</div>" +
            '<div><span class="follow-label">止损</span>' + fmt(it.stop) + "</div>" +
            "</div>" +
            "</div>";
        }).join("");
        bindKlineRows(document.getElementById("history-list"), historyRecords);
      })
      .catch(function () {
        document.getElementById("history-meta").textContent = "历史回放接口请求失败";
        document.getElementById("history-list").innerHTML =
          '<div class="muted">加载失败</div>';
      });

    function bindKlineRows(list, records) {
      var rows = list.querySelectorAll(".history-row");
      Array.prototype.forEach.call(rows, function (el) {
        el.addEventListener("click", function () {
          var all = document.querySelectorAll(".history-row");
          Array.prototype.forEach.call(all, function (item) { item.classList.remove("selected"); });
          el.classList.add("selected");
          var idx = parseInt(el.getAttribute("data-idx"), 10);
          renderKline(records[idx]);
        });
      });
    }

    var selectedBtCombo = "";
    var selectedBtDm = "";

    function fmtPct(v) {
      if (v === null || v === undefined || v === "") return "-";
      var n = Number(v);
      if (isNaN(n)) return String(v);
      return n.toFixed(2) + "%";
    }
    function hideStockKline() {
      var img = document.getElementById("bt-stock-kline");
      if (!img) return;
      img.removeAttribute("src");
      img.style.display = "none";
    }
    function showStockKline(dm) {
      var img = document.getElementById("bt-stock-kline");
      if (!img) return;
      var url = sinaDailyImg(dm);
      if (!url) {
        hideStockKline();
        return;
      }
      img.style.display = "block";
      img.onerror = function () { img.style.display = "none"; };
      img.src = url;
    }
    function btParams() {
      var level = "1";
      var days = "60";
      var levels = document.querySelectorAll("#bt-level-filters .chip");
      Array.prototype.forEach.call(levels, function (el) {
        if (el.classList.contains("active")) level = el.getAttribute("data-value");
      });
      var dayChips = document.querySelectorAll("#bt-days-filters .chip");
      Array.prototype.forEach.call(dayChips, function (el) {
        if (el.classList.contains("active")) days = el.getAttribute("data-value");
      });
      return { day_level: level, days: days };
    }
    function resetBtStock() {
      selectedBtDm = "";
      hideStockKline();
      document.getElementById("bt-stock-meta").textContent = "点击命中详情中的股票查看单股回溯";
      document.getElementById("bt-stock-list").innerHTML =
        '<div class="muted">点击命中详情中的股票查看单股回溯</div>';
    }
    function resetBtDetail() {
      selectedBtCombo = "";
      document.getElementById("bt-group-meta").textContent = "点击上方组合查看详情";
      document.getElementById("bt-group-list").innerHTML =
        '<div class="muted">点击上方组合查看详情</div>';
      resetBtStock();
    }
    function loadBtSummary() {
      var p = btParams();
      document.getElementById("bt-summary-meta").textContent = "加载中…";
      document.getElementById("bt-summary-list").innerHTML =
        '<div class="muted">加载中…</div>';
      resetBtDetail();
      fetch("/api/bt/summary?day_level=" + encodeURIComponent(p.day_level) +
        "&days=" + encodeURIComponent(p.days))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var list = (data && data.list) || [];
          // 只显示胜率>45%的组合
          list = list.filter(function(it) { return (it.win_rate || 0) > 45; });
          document.getElementById("bt-summary-meta").textContent =
            "周期 " + (data.day_level == null ? p.day_level : data.day_level) +
            "　样本范围 " + (data.days == null ? p.days : data.days) + " 天　共 " +
            list.length + " 个组合（胜率>45%，按胜率降序）";
          if (!list.length) {
            document.getElementById("bt-summary-list").innerHTML =
              '<div class="muted">暂无回溯数据，请先运行 bt_build.py</div>';
            return;
          }
          document.getElementById("bt-summary-list").innerHTML = list.map(function (it) {
            return '<div class="follow-item combo-row" data-combo="' + String(it.combo || "") + '">' +
              '<div class="follow-item-head">' +
              '<a href="javascript:void(0)" class="follow-code combo-link">' + comboCn(it.combo) + "</a>" +
              '<span class="' + retClass(it.win_rate) + '">' + fmtPct(it.win_rate) + "</span>" +
              "</div>" +
              '<div class="follow-fields">' +
              '<div><span class="follow-label">样本数</span>' + (it.sample_count == null ? "-" : it.sample_count) + "</div>" +
              '<div><span class="follow-label">胜率</span>' + fmtPct(it.win_rate) + "</div>" +
              '<div><span class="follow-label">最大盈利</span>' + fmtPct(it.max_profit) + "</div>" +
              '<div><span class="follow-label">最小盈利</span>' + fmtPct(it.min_profit) + "</div>" +
              '<div><span class="follow-label">中位数盈利</span>' + fmtPct(it.median_profit) + "</div>" +
              "</div>" +
              "</div>";
          }).join("");
        })
        .catch(function () {
          document.getElementById("bt-summary-meta").textContent = "回溯汇总接口请求失败";
          document.getElementById("bt-summary-list").innerHTML =
            '<div class="muted">加载失败</div>';
        });
    }
    function loadBtGroup(combo) {
      var p = btParams();
      selectedBtCombo = combo || "";
      resetBtStock();
      document.getElementById("bt-group-meta").textContent = "加载中…";
      document.getElementById("bt-group-list").innerHTML =
        '<div class="muted">加载中…</div>';
      fetch("/api/bt/group?combo=" + encodeURIComponent(selectedBtCombo) +
        "&day_level=" + encodeURIComponent(p.day_level) +
        "&days=" + encodeURIComponent(p.days))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var list = (data && data.list) || [];
          document.getElementById("bt-group-meta").textContent =
            "组合 " + comboCn(data.combo || selectedBtCombo) + "　共 " + list.length + " 条";
          if (!list.length) {
            document.getElementById("bt-group-list").innerHTML =
              '<div class="muted">该组合当前范围内无命中</div>';
            return;
          }
          document.getElementById("bt-group-list").innerHTML = list.map(function (it) {
            return '<div class="stock-item bt-hit-row" data-dm="' + String(it.dm || "") + '">' +
              '<div class="stock-title">' +
              '<div class="stock-title-main"><a>' +
              (it.dm || "-") + (it.mc ? " " + it.mc : "") +
              "</a></div>" +
              '<span class="' + retClass(it.profit) + '">' + fmtRet(it.profit) + "</span>" +
              "</div>" +
              '<div class="stock-meta muted">日期 ' + (it.buy_date || "-") +
              "　起始 " + fmt(it.start_price) +
              "　目标 " + fmt(it.end_price) + "</div>" +
              "</div>";
          }).join("");
        })
        .catch(function () {
          document.getElementById("bt-group-meta").textContent = "命中详情接口请求失败";
          document.getElementById("bt-group-list").innerHTML =
            '<div class="muted">加载失败</div>';
        });
    }
    function loadBtStock(dm, combo) {
      var p = btParams();
      selectedBtDm = dm || "";
      selectedBtCombo = combo || selectedBtCombo;
      showStockKline(selectedBtDm);
      document.getElementById("bt-stock-meta").textContent = "加载中…";
      document.getElementById("bt-stock-list").innerHTML =
        '<div class="muted">加载中…</div>';
      fetch("/api/bt/stock?dm=" + encodeURIComponent(selectedBtDm) +
        "&combo=" + encodeURIComponent(selectedBtCombo) +
        "&day_level=" + encodeURIComponent(p.day_level))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var list = (data && data.list) || [];
          document.getElementById("bt-stock-meta").textContent =
            "代码 " + (data.dm || selectedBtDm) +
            "　组合 " + comboCn(data.combo || selectedBtCombo) +
            "　最近 60 自然日　共 " + list.length + " 条";
          if (!list.length) {
            document.getElementById("bt-stock-list").innerHTML =
              '<div class="muted">该股票最近 60 自然日无命中</div>';
            return;
          }
          document.getElementById("bt-stock-list").innerHTML = list.map(function (it) {
            return '<div class="stock-item">' +
              '<div class="stock-title">' +
              "<span>" + (it.buy_date || "-") + "</span>" +
              '<span class="' + retClass(it.profit) + '">' + fmtRet(it.profit) + "</span>" +
              "</div>" +
              '<div class="stock-meta muted">起始 ' + fmt(it.start_price) +
              "　目标 " + fmt(it.end_price) + "</div>" +
              "</div>";
          }).join("");
        })
        .catch(function () {
          document.getElementById("bt-stock-meta").textContent = "单股详情接口请求失败";
          document.getElementById("bt-stock-list").innerHTML =
            '<div class="muted">加载失败</div>';
        });
    }

    function bindChipGroup(boxId) {
      var box = document.getElementById(boxId);
      if (!box) return;
      box.addEventListener("click", function (ev) {
        var t = ev.target;
        if (!t || !t.classList || !t.classList.contains("chip")) return;
        var chips = box.querySelectorAll(".chip");
        Array.prototype.forEach.call(chips, function (c) { c.classList.remove("active"); });
        t.classList.add("active");
        loadBtSummary();
      });
    }
    bindChipGroup("bt-level-filters");
    bindChipGroup("bt-days-filters");
    var selectedSignalCombo = "";
    function loadSignal(combo) {
      selectedSignalCombo = combo || "";
      var meta = document.getElementById("signal-meta");
      var box = document.getElementById("signal-list");
      if (!selectedSignalCombo) {
        meta.textContent = "从回溯分析点击组合名查看当日信号";
        box.innerHTML = '<div class="muted">从回溯分析点击组合名查看当日信号</div>';
        return;
      }
      meta.textContent = "加载中…";
      box.innerHTML = '<div class="muted">加载中…</div>';
      fetch("/api/signal?combo=" + encodeURIComponent(selectedSignalCombo))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var list = (data && data.list) || [];
          meta.textContent =
            "组合 " + comboCn(data.combo || selectedSignalCombo) +
            "　交易日 " + (data.date || "-") +
            "　共 " + list.length + " 只";
          if (!list.length) {
            box.innerHTML = '<div class="muted">该组合最新交易日无命中</div>';
            return;
          }
          box.innerHTML = list.map(function (it) {
            var url = sinaDailyImg(it.dm);
            var img = url
              ? '<img class="signal-kline chart-img" alt="日K" src="' + url + '" onerror="this.style.display=\'none\'">'
              : "";
            return '<div class="stock-item">' +
              '<div class="stock-title">' +
              '<div class="stock-title-main"><a>' +
              (it.dm || "-") + (it.mc ? " " + it.mc : "") +
              "</a></div>" +
              '<span class="' + retClass(it.pct_change) + '">' + fmtRet(it.pct_change) + "</span>" +
              "</div>" +
              '<div class="stock-meta muted">现价 ' + fmt(it.close) +
              "　建议买入 " + fmt(it.entry) +
              "　止损 " + fmt(it.stop) + "</div>" +
              img +
              "</div>";
          }).join("");
        })
        .catch(function () {
          meta.textContent = "当日信号接口请求失败";
          box.innerHTML = '<div class="muted">加载失败</div>';
        });
    }
    document.getElementById("bt-summary-list").addEventListener("click", function (ev) {
      var t = ev.target;
      if (t && t.classList && t.classList.contains("combo-link")) {
        ev.preventDefault();
        ev.stopPropagation();
        var linkRow = t;
        while (linkRow && !(linkRow.classList && linkRow.classList.contains("follow-item"))) {
          linkRow = linkRow.parentNode;
        }
        var combo = (linkRow && linkRow.getAttribute("data-combo")) || "";
        selectedSignalCombo = combo;
        switchTab("signal");
        loadSignal(combo);
        return;
      }
      var row = ev.target;
      while (row && !(row.classList && row.classList.contains("combo-row"))) row = row.parentNode;
      if (!row) return;
      var rows = document.querySelectorAll("#bt-summary-list .combo-row");
      Array.prototype.forEach.call(rows, function (el) { el.classList.remove("selected"); });
      row.classList.add("selected");
      loadBtGroup(row.getAttribute("data-combo") || "");
    });
    document.getElementById("bt-group-list").addEventListener("click", function (ev) {
      var row = ev.target;
      while (row && !(row.classList && row.classList.contains("bt-hit-row"))) row = row.parentNode;
      if (!row) return;
      var rows = document.querySelectorAll("#bt-group-list .bt-hit-row");
      Array.prototype.forEach.call(rows, function (el) { el.classList.remove("selected"); });
      row.classList.add("selected");
      loadBtStock(row.getAttribute("data-dm") || "", selectedBtCombo);
    });
    loadBtSummary();
  </script>
</body>
</html>
