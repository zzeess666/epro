<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EPro 推荐</title>
  <style>
    body { font-family: sans-serif; margin: 24px; color: #222; background: #fafafa; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    h2 { font-size: 16px; margin: 24px 0 8px; }
    .meta { color: #666; font-size: 13px; margin-bottom: 12px; }
    table { border-collapse: collapse; width: 100%; max-width: 900px; background: #fff; }
    table.wide { max-width: 1100px; }
    th, td { border: 1px solid #ddd; padding: 8px 10px; text-align: left; font-size: 14px; }
    th { background: #f0f0f0; }
    th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
    th.sortable:hover { background: #e4e4e4; }
    th.sorted { background: #dbeafe; }
    .ok { color: #0a7; font-weight: 600; }
    .fail { color: #c33; font-weight: 600; }
    .watch { color: #c80; }
    .empty { color: #888; }
    .alert { background: #fff7e6; border: 1px solid #f0c36d; padding: 8px 12px; margin: 8px 0 16px; max-width: 900px; }
    .history-row { cursor: pointer; }
    .history-row:hover { background: #f5f5f5; }
    .history-row.selected { background: #e6f4ff; }
    .up { color: #c33; font-weight: 600; }
    .down { color: #0a7; font-weight: 600; }
    .factor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 12px; max-width: 900px; margin: 8px 0 12px; }
    .factor-grid label { font-size: 13px; background: #fff; border: 1px solid #ddd; padding: 6px 8px; }
    .controls { margin: 8px 0 12px; }
    .controls select, .controls button { padding: 6px 12px; margin-right: 8px; }
    .controls button[disabled] { opacity: 0.55; cursor: not-allowed; }
    #kline-chart { width: 100%; max-width: 900px; height: 420px; background: #fff; margin-top: 12px; border: 1px solid #ddd; display: none; }
  </style>
</head>
<body>
  <h1>EPro 今日推荐</h1>
  <div class="meta" id="rec-date">加载中…</div>
  <div id="alerts"></div>
  <table>
    <thead>
      <tr>
        <th>代码</th>
        <th>策略</th>
        <th>评分</th>
        <th>买入价</th>
        <th>止损价</th>
      </tr>
    </thead>
    <tbody id="recommend-body">
      <tr><td colspan="5" class="empty">加载中…</td></tr>
    </tbody>
  </table>

  <h2>跟踪状态</h2>
  <div class="meta" id="track-date"></div>
  <table>
    <thead>
      <tr>
        <th>代码</th>
        <th>状态</th>
        <th>最新价</th>
        <th>买入价</th>
        <th>止损价</th>
      </tr>
    </thead>
    <tbody id="track-body">
      <tr><td colspan="5" class="empty">加载中…</td></tr>
    </tbody>
  </table>

  <h2>历史回放</h2>
  <div class="meta" id="history-meta">加载中…</div>
  <table>
    <thead>
      <tr>
        <th>买入日</th>
        <th>代码</th>
        <th>名称</th>
        <th>买入价</th>
        <th>止损价</th>
        <th>收益</th>
      </tr>
    </thead>
    <tbody id="history-body">
      <tr><td colspan="6" class="empty">加载中…</td></tr>
    </tbody>
  </table>

  <h2>组合胜率排行</h2>
  <div class="meta" id="combo-meta">加载中…</div>
  <table class="wide">
    <thead>
      <tr id="combo-head">
        <th class="sortable" data-key="combo">组合</th>
        <th class="sortable" data-key="period">周期</th>
        <th class="sortable" data-key="test_win_rate">测试胜率</th>
        <th class="sortable" data-key="test_expectation">期望收益</th>
        <th class="sortable" data-key="test_ratio">盈亏比</th>
        <th class="sortable" data-key="test_sample">样本</th>
        <th class="sortable" data-key="train_win_rate">训练胜率</th>
      </tr>
    </thead>
    <tbody id="combo-body">
      <tr><td colspan="7" class="empty">加载中…</td></tr>
    </tbody>
  </table>

  <h2>手动回溯</h2>
  <div class="meta">勾选 2～3 个因子，选择周期后点击回溯（全市场约需数分钟）</div>
  <div class="factor-grid" id="factor-box"></div>
  <div class="controls">
    <label>周期
      <select id="period-select">
        <option value="超短">超短</option>
        <option value="短" selected>短</option>
        <option value="中短">中短</option>
        <option value="中">中</option>
      </select>
    </label>
    <button type="button" id="backtest-btn" disabled>回溯</button>
    <span class="meta" id="backtest-hint">请勾选 2～3 个因子</span>
  </div>
  <div class="meta" id="backtest-meta"></div>
  <table>
    <thead>
      <tr>
        <th>买入日</th>
        <th>代码</th>
        <th>名称</th>
        <th>买入价</th>
        <th>止损价</th>
        <th>收益</th>
      </tr>
    </thead>
    <tbody id="backtest-body">
      <tr><td colspan="6" class="empty">请勾选因子后回溯</td></tr>
    </tbody>
  </table>
  <div class="meta" id="chart-title"></div>
  <div id="kline-chart"></div>

  <script src="/echarts.min.js"></script>

  <script>
    function fmt(v) {
      if (v === null || v === undefined || v === "") return "-";
      if (typeof v === "number") return v.toFixed(2);
      return String(v);
    }
    function statusClass(s) {
      if (s === "达标") return "ok";
      if (s === "不达标") return "fail";
      return "watch";
    }
    function renderTable(tbody, rows, cols, emptyText) {
      if (!rows || !rows.length) {
        tbody.innerHTML = '<tr><td colspan="' + cols + '" class="empty">' + emptyText + "</td></tr>";
        return;
      }
      tbody.innerHTML = rows.map(function (r) { return r; }).join("");
    }

    fetch("/api/recommend")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        document.getElementById("rec-date").textContent =
          data.date ? ("推荐日 " + data.date + "（最多 3 只）") : "暂无推荐";
        var items = data.items || [];
        renderTable(
          document.getElementById("recommend-body"),
          items.map(function (it) {
            return "<tr>" +
              "<td>" + (it.dm || "-") + (it.mc ? " " + it.mc : "") + "</td>" +
              "<td>" + (it.strategy || "-") + "</td>" +
              "<td>" + fmt(it.score) + "</td>" +
              "<td>" + fmt(it.entry_price) + "</td>" +
              "<td>" + fmt(it.stop_loss) + "</td>" +
              "</tr>";
          }),
          5,
          "暂无推荐"
        );
      })
      .catch(function () {
        document.getElementById("rec-date").textContent = "推荐接口请求失败";
        document.getElementById("recommend-body").innerHTML =
          '<tr><td colspan="5" class="empty">加载失败</td></tr>';
      });

    fetch("/api/track")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        document.getElementById("track-date").textContent =
          data.date ? ("跟踪日 " + data.date) : "暂无跟踪";
        var alerts = data.alerts || [];
        var box = document.getElementById("alerts");
        if (alerts.length) {
          box.innerHTML = alerts.map(function (a) {
            return '<div class="alert">尾盘提醒：' +
              (a.dm || "") + " " + (a.mc || "") +
              " 最新价 " + fmt(a.current_price) +
              " / 买入 " + fmt(a.entry_price) +
              " / 止损 " + fmt(a.stop_loss) +
              "</div>";
          }).join("");
        }
        var items = data.items || [];
        renderTable(
          document.getElementById("track-body"),
          items.map(function (it) {
            return "<tr>" +
              "<td>" + (it.dm || "-") + (it.mc ? " " + it.mc : "") + "</td>" +
              '<td class="' + statusClass(it.status) + '">' + (it.status || "-") + "</td>" +
              "<td>" + fmt(it.current_price) + "</td>" +
              "<td>" + fmt(it.entry_price) + "</td>" +
              "<td>" + fmt(it.stop_loss) + "</td>" +
              "</tr>";
          }),
          5,
          "暂无跟踪"
        );
      })
      .catch(function () {
        document.getElementById("track-date").textContent = "跟踪接口请求失败";
        document.getElementById("track-body").innerHTML =
          '<tr><td colspan="5" class="empty">加载失败</td></tr>';
      });

    var historyRecords = [];
    var historyChart = null;

    function retClass(v) {
      if (typeof v !== "number") return "";
      return v > 0 ? "up" : "down";
    }
    function fmtRet(v) {
      if (v === null || v === undefined || v === "") return "-";
      var n = Number(v);
      if (isNaN(n)) return String(v);
      return (n > 0 ? "+" : "") + n.toFixed(2) + "%";
    }
    function fmtAxisDate(s) {
      if (!s) return "";
      return String(s).slice(5);
    }
    function renderKline(rec) {
      var box = document.getElementById("kline-chart");
      var title = document.getElementById("chart-title");
      if (!rec) return;
      title.textContent =
        (rec.dm || "") + " " + (rec.mc || "") +
        " 买入日 " + (rec.buy_date || "-") +
        " 买入 " + fmt(rec.entry) +
        " 止损 " + fmt(rec.stop);
      if (typeof echarts === "undefined") {
        box.style.display = "none";
        title.textContent += "（ECharts 未加载）";
        return;
      }
      title.textContent += "　K线加载中…";
      fetch("/api/kline?dm=" + encodeURIComponent(rec.dm || "") + "&date=" + encodeURIComponent(rec.buy_date || ""))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var klines = (data && data.klines) || [];
          if (!klines.length) {
            box.style.display = "none";
            title.textContent = title.textContent.replace("　K线加载中…", "（无K线数据）");
            return;
          }
          title.textContent = title.textContent.replace("　K线加载中…", "");
          box.style.display = "block";
          void box.offsetWidth;
          if (box.scrollIntoView) {
            box.scrollIntoView({ behavior: "smooth", block: "nearest" });
          }
          if (!historyChart) {
            historyChart = echarts.init(box);
            window.addEventListener("resize", function () {
              if (historyChart) historyChart.resize();
            });
          } else {
            historyChart.resize();
          }
          var dates = klines.map(function (k) { return k.t || ""; });
          var candle = klines.map(function (k) {
            return [k.o, k.c, k.l, k.h];
          });
          var ma5 = klines.map(function (k) { return k.ma5; });
          var ma10 = klines.map(function (k) { return k.ma10; });
          var ma20 = klines.map(function (k) { return k.ma20; });
          var buyDate = rec.buy_date || "";
          var markPointData = [];
          if (buyDate && dates.indexOf(buyDate) >= 0 && rec.entry != null) {
            markPointData.push({
              name: "买入",
              coord: [buyDate, rec.entry],
              value: rec.entry,
              itemStyle: { color: "#1677ff" },
              label: { formatter: "买入 " + fmt(rec.entry) }
            });
          }
          var markLineData = [];
          if (rec.stop != null) {
            markLineData.push({
              name: "止损",
              yAxis: rec.stop,
              lineStyle: { color: "#c33", type: "dashed", width: 1.5 },
              label: { formatter: "止损 " + fmt(rec.stop), position: "insideEndTop" }
            });
          }
          historyChart.setOption({
            animation: false,
            legend: { data: ["K线", "MA5", "MA10", "MA20"], top: 4 },
            tooltip: {
              trigger: "axis",
              axisPointer: { type: "cross" }
            },
            grid: { left: 48, right: 24, top: 36, bottom: 48 },
            xAxis: {
              type: "category",
              data: dates,
              axisLabel: { formatter: fmtAxisDate },
              boundaryGap: true
            },
            yAxis: { scale: true, splitLine: { lineStyle: { type: "dotted" } } },
            dataZoom: [{ type: "inside" }, { type: "slider", height: 18, bottom: 8 }],
            series: [
              {
                name: "K线",
                type: "candlestick",
                data: candle,
                itemStyle: {
                  color: "#ef232a",
                  color0: "#14b143",
                  borderColor: "#ef232a",
                  borderColor0: "#14b143"
                },
                markPoint: {
                  symbol: "pin",
                  symbolSize: 48,
                  data: markPointData
                },
                markLine: {
                  silent: true,
                  symbol: "none",
                  data: markLineData
                }
              },
              { name: "MA5", type: "line", data: ma5, showSymbol: false, lineStyle: { width: 1.2 }, color: "#fa8c16" },
              { name: "MA10", type: "line", data: ma10, showSymbol: false, lineStyle: { width: 1.2 }, color: "#1677ff" },
              { name: "MA20", type: "line", data: ma20, showSymbol: false, lineStyle: { width: 1.2 }, color: "#722ed1" }
            ]
          }, true);
        })
        .catch(function () {
          box.style.display = "none";
          title.textContent = title.textContent.replace("　K线加载中…", "（K线加载失败）");
        });
    }

    fetch("/api/history")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var combo = data.combo || "-";
        var period = data.period || "-";
        var wr = data.win_rate;
        var exp = data.expectation;
        document.getElementById("history-meta").textContent =
          "最优组合 " + combo +
          "　周期 " + period +
          "　胜率 " + (wr == null ? "-" : Number(wr).toFixed(2) + "%") +
          "　期望收益 " + (exp == null ? "-" : Number(exp).toFixed(2));
        historyRecords = data.records || [];
        if (!historyRecords.length) {
          document.getElementById("history-body").innerHTML =
            '<tr><td colspan="6" class="empty">暂无历史回放，请先运行 replay_save.py</td></tr>';
          return;
        }
        document.getElementById("history-body").innerHTML = historyRecords.map(function (it, i) {
          return '<tr class="history-row" data-idx="' + i + '">' +
            "<td>" + (it.buy_date || "-") + "</td>" +
            "<td>" + (it.dm || "-") + "</td>" +
            "<td>" + (it.mc || "-") + "</td>" +
            "<td>" + fmt(it.entry) + "</td>" +
            "<td>" + fmt(it.stop) + "</td>" +
            '<td class="' + retClass(it.ret) + '">' + fmtRet(it.ret) + "</td>" +
            "</tr>";
        }).join("");
        bindKlineRows(document.getElementById("history-body"), historyRecords);
      })
      .catch(function () {
        document.getElementById("history-meta").textContent = "历史回放接口请求失败";
        document.getElementById("history-body").innerHTML =
          '<tr><td colspan="6" class="empty">加载失败</td></tr>';
      });

    function bindKlineRows(tbody, records) {
      var rows = tbody.querySelectorAll(".history-row");
      Array.prototype.forEach.call(rows, function (tr) {
        tr.addEventListener("click", function () {
          var all = document.querySelectorAll(".history-row");
          Array.prototype.forEach.call(all, function (el) { el.classList.remove("selected"); });
          tr.classList.add("selected");
          var idx = parseInt(tr.getAttribute("data-idx"), 10);
          renderKline(records[idx]);
        });
      });
    }

    var FACTORS = [
      "macd_golden", "gap_up", "one_yang_3ma", "ma_bull", "above_ma20", "ma5_cross_10",
      "second_breakout", "shrink_pullback", "volume_ratio_high", "new_high_20",
      "limit_up", "expma_golden", "box_breakout", "kline_reversal"
    ];
    var comboAll = [];
    var comboSortKey = "test_win_rate";
    var comboSortDir = "desc";
    var backtestRecords = [];

    function fmtPct(v) {
      if (v === null || v === undefined || v === "") return "-";
      var n = Number(v);
      if (isNaN(n)) return String(v);
      return n.toFixed(2) + "%";
    }
    function fmtNum(v) {
      if (v === null || v === undefined || v === "") return "-";
      var n = Number(v);
      if (isNaN(n)) return String(v);
      return n.toFixed(2);
    }
    function selectedFactors() {
      var out = [];
      var boxes = document.querySelectorAll("#factor-box input[type=checkbox]");
      Array.prototype.forEach.call(boxes, function (b) {
        if (b.checked) out.push(b.value);
      });
      return out;
    }
    function syncFactorChecks() {
      var names = selectedFactors();
      var n = names.length;
      var boxes = document.querySelectorAll("#factor-box input[type=checkbox]");
      Array.prototype.forEach.call(boxes, function (b) {
        if (!b.checked) b.disabled = n >= 3;
      });
      var btn = document.getElementById("backtest-btn");
      var hint = document.getElementById("backtest-hint");
      if (n < 2) {
        btn.disabled = true;
        hint.textContent = "请勾选 2～3 个因子";
      } else if (n > 3) {
        btn.disabled = true;
        hint.textContent = "最多勾选 3 个因子";
      } else {
        btn.disabled = false;
        hint.textContent = "已选 " + n + " 个因子";
      }
    }
    function comboCompare(a, b, key, dir) {
      var va = a[key];
      var vb = b[key];
      var cmp;
      if (typeof va === "number" && typeof vb === "number") {
        cmp = va - vb;
      } else if (va == null && vb == null) {
        cmp = 0;
      } else if (va == null) {
        cmp = -1;
      } else if (vb == null) {
        cmp = 1;
      } else {
        cmp = String(va).localeCompare(String(vb), "zh");
      }
      return dir === "desc" ? -cmp : cmp;
    }
    function updateComboHead() {
      var ths = document.querySelectorAll("#combo-head th.sortable");
      Array.prototype.forEach.call(ths, function (th) {
        var key = th.getAttribute("data-key");
        var base = th.getAttribute("data-label") || th.textContent.replace(/[▲▼]\s*$/, "").trim();
        th.setAttribute("data-label", base);
        th.classList.remove("sorted");
        if (key === comboSortKey) {
          th.classList.add("sorted");
          th.textContent = base + (comboSortDir === "desc" ? " ▼" : " ▲");
        } else {
          th.textContent = base;
        }
      });
    }
    function renderComboTable() {
      var sorted = comboAll.slice().sort(function (a, b) {
        var c = comboCompare(a, b, comboSortKey, comboSortDir);
        if (c !== 0) return c;
        return comboCompare(a, b, "combo", "asc");
      });
      var top = sorted.slice(0, 20);
      document.getElementById("combo-meta").textContent =
        "共 " + comboAll.length + " 个组合，按当前排序展示 TOP " + top.length;
      if (!top.length) {
        document.getElementById("combo-body").innerHTML =
          '<tr><td colspan="7" class="empty">暂无组合排行，请先运行 run_miner.py</td></tr>';
        return;
      }
      document.getElementById("combo-body").innerHTML = top.map(function (it) {
        return "<tr>" +
          "<td>" + (it.combo || "-") + "</td>" +
          "<td>" + (it.period || "-") + "</td>" +
          "<td>" + fmtPct(it.test_win_rate) + "</td>" +
          "<td>" + fmtNum(it.test_expectation) + "</td>" +
          "<td>" + fmtNum(it.test_ratio) + "</td>" +
          "<td>" + (it.test_sample == null ? "-" : it.test_sample) + "</td>" +
          "<td>" + fmtPct(it.train_win_rate) + "</td>" +
          "</tr>";
      }).join("");
      updateComboHead();
    }
    function renderBacktestRows(records) {
      backtestRecords = records || [];
      var tbody = document.getElementById("backtest-body");
      if (!backtestRecords.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty">该组合测试期无回踩成交记录</td></tr>';
        return;
      }
      tbody.innerHTML = backtestRecords.map(function (it, i) {
        return '<tr class="history-row" data-idx="' + i + '">' +
          "<td>" + (it.buy_date || "-") + "</td>" +
          "<td>" + (it.dm || "-") + "</td>" +
          "<td>" + (it.mc || "-") + "</td>" +
          "<td>" + fmt(it.entry) + "</td>" +
          "<td>" + fmt(it.stop) + "</td>" +
          '<td class="' + retClass(it.ret) + '">' + fmtRet(it.ret) + "</td>" +
          "</tr>";
      }).join("");
      bindKlineRows(tbody, backtestRecords);
    }

    document.getElementById("factor-box").innerHTML = FACTORS.map(function (name) {
      return '<label><input type="checkbox" value="' + name + '"> ' + name + "</label>";
    }).join("");
    document.getElementById("factor-box").addEventListener("change", syncFactorChecks);
    syncFactorChecks();

    document.getElementById("combo-head").addEventListener("click", function (ev) {
      var th = ev.target;
      if (!th || !th.getAttribute) return;
      if (th.tagName !== "TH" || !th.classList.contains("sortable")) return;
      var key = th.getAttribute("data-key");
      if (!key) return;
      if (comboSortKey === key) {
        comboSortDir = comboSortDir === "desc" ? "asc" : "desc";
      } else {
        comboSortKey = key;
        comboSortDir = key === "combo" || key === "period" ? "asc" : "desc";
      }
      renderComboTable();
    });

    fetch("/api/combos")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        comboAll = data.combos || [];
        renderComboTable();
      })
      .catch(function () {
        document.getElementById("combo-meta").textContent = "组合排行接口请求失败";
        document.getElementById("combo-body").innerHTML =
          '<tr><td colspan="7" class="empty">加载失败</td></tr>';
      });

    document.getElementById("backtest-btn").addEventListener("click", function () {
      var names = selectedFactors();
      if (names.length < 2 || names.length > 3) {
        document.getElementById("backtest-meta").textContent = "请勾选 2～3 个因子";
        return;
      }
      var period = document.getElementById("period-select").value;
      var btn = document.getElementById("backtest-btn");
      btn.disabled = true;
      document.getElementById("backtest-meta").textContent = "回溯中，全市场约需数分钟…";
      document.getElementById("backtest-body").innerHTML =
        '<tr><td colspan="6" class="empty">回溯计算中…</td></tr>';
      fetch("/api/backtest?factors=" + encodeURIComponent(names.join(",")) +
        "&period=" + encodeURIComponent(period) + "&limit=100")
        .then(function (r) {
          return r.json().then(function (data) {
            return { ok: r.ok, data: data };
          });
        })
        .then(function (res) {
          var data = res.data || {};
          if (!res.ok) {
            document.getElementById("backtest-meta").textContent = data.error || "回溯失败";
            document.getElementById("backtest-body").innerHTML =
              '<tr><td colspan="6" class="empty">回溯失败</td></tr>';
            return;
          }
          var wr = data.test_win_rate;
          var exp = data.test_expectation;
          var ratio = data.test_ratio;
          var n = data.test_sample;
          var recs = data.records || [];
          document.getElementById("backtest-meta").textContent =
            "组合 " + (data.combo || "-") +
            "　周期 " + (data.period || "-") +
            "　胜率 " + (wr == null ? "-" : Number(wr).toFixed(2) + "%") +
            "　期望 " + (exp == null ? "-" : Number(exp).toFixed(2)) +
            "　盈亏比 " + (ratio == null ? "-" : Number(ratio).toFixed(2)) +
            "　样本 " + (n == null ? "-" : n) +
            "　展示 " + recs.length + " 条";
          renderBacktestRows(recs);
        })
        .catch(function () {
          document.getElementById("backtest-meta").textContent = "回溯接口请求失败";
          document.getElementById("backtest-body").innerHTML =
            '<tr><td colspan="6" class="empty">请求失败</td></tr>';
        })
        .then(function () {
          syncFactorChecks();
        });
    });
  </script>
</body>
</html>
